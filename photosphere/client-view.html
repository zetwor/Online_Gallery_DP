<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Перегляд галереї | PhotoSphere</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,sans-serif;background:#090909;color:#fff;min-height:100vh}
button,input,textarea{font-family:inherit}
.wrap{max-width:1300px;margin:auto;padding:32px}
.logo{font-size:28px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:10px}.logo i,.red{color:#e53935}
.header{text-align:center;padding:35px 0}.header h1{font-size:44px;margin:18px 0 8px}.muted{color:#aaa;line-height:1.6}.client-id{font-size:13px;color:#777;margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px}.item{position:relative;aspect-ratio:1;border-radius:24px;overflow:hidden;background:#111;border:1px solid #282828;cursor:pointer}.item:hover{border-color:#e53935}.item img{width:100%;height:100%;object-fit:cover;display:block;transition:.25s}.item:hover img{transform:scale(1.04)}
.over{position:absolute;inset:auto 0 0;background:linear-gradient(to top,rgba(0,0,0,.9),transparent);padding:18px;display:flex;justify-content:center;gap:12px;opacity:0;transition:.2s}.item:hover .over{opacity:1}.heart{font-size:32px;color:#fff;cursor:pointer}.heart.on{color:#e53935}.like-count{position:absolute;top:12px;left:12px;background:rgba(0,0,0,.68);padding:8px 12px;border-radius:999px;font-weight:900;backdrop-filter:blur(8px)}
.feedback{margin-top:50px;background:#111;border:1px solid rgba(229,57,53,.55);border-radius:32px;padding:28px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px}.group{margin-bottom:15px}.group label{display:block;margin-bottom:7px;font-weight:800}.group input,.group textarea{width:100%;padding:14px 16px;border-radius:17px;border:1px solid #333;background:#171717;color:#fff;outline:none}.group input:focus,.group textarea:focus{border-color:#e53935;box-shadow:0 0 0 4px rgba(229,57,53,.12)}
.btn{border:none;border-radius:999px;padding:13px 24px;background:linear-gradient(135deg,#ff4b47,#c62828);color:#fff;font-weight:900;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}.btn:hover{filter:brightness(1.08)}.btn-dark{background:#181818;border:1px solid #333}.btn-dark:hover{border-color:#e53935}
.msg{display:none;margin-top:13px;padding:13px;border-radius:16px}.success{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.35);color:#67e8ae}.error{background:rgba(229,57,53,.12);border:1px solid rgba(229,57,53,.35);color:#ff9b98}
.pass-card{background:#111;border:1px solid #e53935;border-radius:28px;padding:28px;max-width:470px;margin:100px auto;text-align:center}.empty{text-align:center;margin:80px auto;color:#aaa;max-width:560px}.empty h1{color:#fff;margin-bottom:12px}.empty i{font-size:52px;color:#e53935;margin-bottom:18px}
.viewer{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:1000;align-items:center;justify-content:center;padding:18px}.viewer.open{display:flex}.viewer-card{position:relative;background:#0b0b0b;border:1px solid rgba(229,57,53,.75);border-radius:28px;padding:18px;max-width:95vw;box-shadow:0 25px 90px rgba(0,0,0,.75)}.viewer-img{max-width:88vw;max-height:76vh;border-radius:20px;object-fit:contain;display:block}.close{position:absolute;right:14px;top:14px;font-size:32px;cursor:pointer;z-index:4;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.72);border:1px solid #444;color:#fff}.close:hover{background:#e53935;border-color:#e53935}.nav{position:absolute;top:50%;transform:translateY(-50%);width:58px;height:58px;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;border:1px solid #444;font-size:26px;cursor:pointer;z-index:3}.nav:hover{background:#e53935;border-color:#e53935}.prev{left:24px}.next{right:24px}.counter{position:absolute;top:24px;left:24px;background:rgba(0,0,0,.68);padding:9px 14px;border-radius:999px;font-weight:800;z-index:3}.viewer-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:13px}.client-replies{margin-top:28px;display:grid;gap:14px}.dialog-card{background:#0d0d0d;border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:18px}.dialog-card h3{font-size:16px;margin-bottom:8px}.dialog-card p{color:#bbb;line-height:1.6;margin:8px 0}.reply-answer{margin-top:12px;background:rgba(229,57,53,.09);border:1px solid rgba(229,57,53,.35);border-radius:18px;padding:14px}.reply-answer b{color:#ff7774}.reply-empty{color:#888;font-size:14px;margin-top:10px}
@media(max-width:700px){.form-row{grid-template-columns:1fr}.header h1{font-size:32px}.wrap{padding:18px}.grid{grid-template-columns:1fr}.nav{width:46px;height:46px}.prev{left:8px}.next{right:8px}.viewer-img{max-width:92vw;max-height:68vh}}
</style>
</head>
<body>
<div class="wrap">
  <div id="passBox" style="display:none" class="pass-card">
    <div class="logo"><i class="fa-solid fa-camera-retro"></i> Photo<span class="red">Sphere</span></div>
    <h2 style="margin:20px 0 8px">Приватна галерея</h2>
    <p class="muted">Введіть пароль, який надав фотограф</p>
    <div class="group" style="margin-top:20px"><input id="passInput" type="password" placeholder="Пароль"></div>
    <button class="btn" id="passBtn"><i class="fa-solid fa-lock-open"></i> Відкрити</button>
    <div class="msg error" id="passError"></div>
  </div>

  <div id="gallery" style="display:none">
    <div class="header">
      <div class="logo"><i class="fa-solid fa-camera-retro"></i> Photo<span class="red">Sphere</span></div>
      <h1 id="title"></h1>
      <p id="desc" class="muted"></p>
      <div class="client-id" id="photographerInfo"></div>
    </div>
    <div id="photos" class="grid"></div>

    <div class="feedback">
      <h2><i class="fa-solid fa-message red"></i> Написати фотографу</h2>
      <p class="muted" style="margin:8px 0 20px">Повідомлення збережеться у кабінеті фотографа. Відповідь фотографа з’явиться тут, на цій сторінці альбому.</p>
      <form id="messageForm">
        <div class="form-row">
          <div class="group"><label>Ваше ім'я</label><input id="clientName" required></div>
          <div class="group"><label>Ваш email</label><input id="clientEmail" type="email" required></div>
        </div>
        <div class="group"><label>Нік фотографа</label><input id="photographerNick" required placeholder="Наприклад: julia_photo"></div>
        <div class="group"><label>Повідомлення</label><textarea id="clientText" rows="5" required></textarea></div>
        <button class="btn" type="submit"><i class="fa-solid fa-paper-plane"></i> Надіслати повідомлення</button>
        <div class="msg success" id="okMsg"> Повідомлення надіслано фотографу.</div>
        <div class="msg error" id="errMsg"></div>
      </form>
      <div class="client-replies" id="clientReplies"></div>
    </div>
  </div>
</div>

<div class="viewer" id="viewer" aria-hidden="true">
  <button class="nav prev" id="prev" type="button"><i class="fa-solid fa-chevron-left"></i></button>
  <button class="nav next" id="next" type="button"><i class="fa-solid fa-chevron-right"></i></button>
  <div class="counter" id="viewerCounter"></div>
  <div class="viewer-card">
    <button class="close" id="closeViewer" type="button">&times;</button>
    <img id="viewerImg" class="viewer-img" alt="Фото">
    <div class="viewer-actions">
      <button class="btn" id="favBtn" type="button"><i class="fa-regular fa-heart"></i> В обране</button>
      <button class="btn btn-dark" id="downloadBtn" type="button"><i class="fa-solid fa-download"></i> Завантажити</button>
    </div>
  </div>
</div>

<script src="client-view.js"></script>
</body>
</html>
